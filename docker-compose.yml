# Local development: docker compose up
# Frontend http://localhost:5173 · API http://localhost:8000/docs
name: omnireview

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnireview
      POSTGRES_USER: omnireview
      POSTGRES_PASSWORD: omnireview-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnireview -d omnireview"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Job queue and cache for the upcoming background workers.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Applies migrations and (re)creates the demo accounts from scripts/seed_dev.py on every start.
    command: sh -c "alembic upgrade head && python -m scripts.seed_dev && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://omnireview:omnireview-dev-password@postgres:5432/omnireview
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      # Development-only fallback so a fresh clone starts; set JWT_SECRET_KEY in your shell to override.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-do-not-use-in-production-0123}
      # Development-only key for encrypting users' saved API keys (32 bytes, base64); override the same way.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-ZGV2LW9ubHktaW5zZWN1cmUtZW5jcnlwdGlvbi1rZXk=}
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
