name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnireview_test
          POSTGRES_USER: omnireview
          POSTGRES_PASSWORD: omnireview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnireview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://omnireview:omnireview@localhost:5432/omnireview_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.2"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test (against PostgreSQL)
        run: uv run pytest
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.12 pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          touch backend/.env
          SITE_ADDRESS=example.com POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
      - name: Build API image
        run: docker build -t omnireview-api ./backend
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t omnireview-web .
