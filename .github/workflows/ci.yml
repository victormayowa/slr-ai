name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnireview_test
          POSTGRES_USER: omnireview
          POSTGRES_PASSWORD: omnireview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnireview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://omnireview:omnireview@localhost:5432/omnireview_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.2"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test (against PostgreSQL)
        run: uv run pytest
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://omnireview:omnireview@localhost:5432/omnireview_test
          JWT_SECRET_KEY: ci-only-secret-key-with-plenty-of-length-0123456789
        run: uv run alembic upgrade head && uv run alembic check
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.12 pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check operations scripts
        run: shellcheck -S warning ops/*.sh backend/scripts/*.sh

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ops]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          touch backend/.env
          SITE_ADDRESS=example.com POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
      - name: Build API image (without the analysis tools, to keep CI fast)
        run: docker build --build-arg WITH_ANALYSIS_TOOLS=false -t omnireview-api ./backend
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t omnireview-web .

  # Every push to main that passes the checks above goes live on the VPS. The server pulls the commit itself and runs
  # ops/deploy.sh, which backs up first, waits for the health checks, and rolls the code back if they fail.
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ops, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # One deploy at a time, and never cancel one half-way through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/omnireview' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's public key is pinned in a secret, so a changed host key stops the deploy.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --prune --tags origin && ops/deploy.sh '${{ github.sha }}'"
