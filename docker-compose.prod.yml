# Production on a single VPS:
#   SITE_ADDRESS=app.example.com POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
# backend/.env must hold production secrets (JWT_SECRET_KEY, DATA_ENCRYPTION_KEY, provider keys, SENTRY_DSN).
name: omnireview

services:
  caddy:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain, e.g. app.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'"]
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://omnireview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/omnireview
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://${SITE_ADDRESS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs background AI jobs. Scale with: docker compose -f docker-compose.prod.yml up -d --scale worker=2
  worker:
    build: ./backend
    command: ["arq", "workers.ai_worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://omnireview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/omnireview
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnireview
      POSTGRES_USER: omnireview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnireview -d omnireview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
