[project]
name = "omnireview-api"
version = "0.1.0"
description = "OmniReview backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic==1.2.0",
    "arq>=0.25.0",
    "bcrypt==5.0.0",
    "boto3>=1.43.96",
    "cryptography>=50.0.1",
    "defusedxml>=0.7.1",
    "fastapi==0.141.1",
    "google-genai==2.20.0",
    "httpx==0.28.1",
    "openai==3.6.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic==2.13.5",
    "pyjwt==2.13.0",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "requests==2.34.2",
    "sentry-sdk[fastapi]",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "mypy",
    "pytest",
    "ruff",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20260827",
    "types-requests",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI declares dependencies with Depends() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are prose; wrapping their lines would change what the model sees.
"services/ai_*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Modules are imported from the backend root (e.g. `llm.runner`), which has no top-level package.
explicit_package_bases = true
exclude = ["^venv/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls external literature APIs over the network"]
addopts = "-m 'not live'"
